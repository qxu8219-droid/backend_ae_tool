[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-log-replay-backend"
version = "0.1.0"
description = "Robot log replay API contracts; IsaacSim runs in an independent worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "robot-replay-protocol==0.1.0",
  "fastapi==0.161.1",
  "pydantic==2.14.1",
  "python-multipart==0.0.32",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.1.1", "jsonschema==4.26.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests/contracts"]
addopts = "-q"
